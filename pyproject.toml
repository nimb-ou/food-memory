[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-memory"
version = "0.1.0"
description = "Retrieval-first image classification on Food-101 with exact memory and FAISS fallback."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Food Memory"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "datasets>=2.18",
  "transformers>=4.40",
  "torch>=2.2",
  "faiss-cpu==1.13.2",
  "tqdm>=4.66",
  "psutil>=5.9",
  "matplotlib>=3.7",
  "nbformat>=5.9",
  "python-docx>=1.0",
  "python-pptx>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["food_memory*"]

